<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملفاتي</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 16px; color: #222; }
  .wrap { max-width: 600px; margin: 0 auto; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
  button.ghost { background: #e5e7eb; color: #222; }
  button.del { background: #ef4444; padding: 6px 10px; font-size: 13px; }
  button.sm { padding: 6px 10px; font-size: 13px; }
  input[type=text], textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font: inherit; margin-bottom: 8px; }
  textarea { min-height: 160px; direction: ltr; font-family: monospace; font-size: 13px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .item { background: #fff; padding: 12px; border-radius: 10px; margin-top: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item small { color: #6b7280; display: block; }
  #login { text-align: center; margin-top: 30vh; }
  .hidden { display: none; }
  #status { color: #6b7280; font-size: 14px; margin: 8px 0; min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h2>ملفاتي</h2>
    <button id="btnLogin">تسجيل الدخول بحساب غوغل</button>
  </div>

  <div id="app" class="hidden">
    <div class="bar">
      <strong id="userName"></strong>
      <button class="ghost sm" id="btnLogout">خروج</button>
    </div>

    <input type="text" id="fileName" placeholder="اسم الملف">
    <textarea id="jsonText" placeholder='{"مثال": "الصق JSON هنا"}'></textarea>
    <input type="file" id="filePick" accept=".json,application/json" style="margin-bottom:8px">
    <button id="btnSave">حفظ</button>
    <div id="status"></div>
    <div id="list"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDoc, getDocs, deleteDoc, doc, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBK11ZOviCU5nAH2nSLekqeuZmSuXx6RtQ",
  authDomain: "note-87e25.firebaseapp.com",
  projectId: "note-87e25",
  appId: "1:994635302087:web:93b427f586fd61af626ae2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const status = t => $("status").textContent = t;

async function pack(str) {
  const stream = new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = ""; buf.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
async function unpack(b64) {
  const bin = atob(b64);
  const buf = Uint8Array.from(bin, c => c.charCodeAt(0));
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}

$("btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message));
$("btnLogout").onclick = () => signOut(auth);

$("filePick").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("jsonText").value = await f.text();
  if (!$("fileName").value) $("fileName").value = f.name.replace(/\.json$/i, "");
};

onAuthStateChanged(auth, user => {
  $("login").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  if (user) {
    $("userName").textContent = user.displayName || user.email;
    loadList();
  }
});

async function loadList() {
  const uid = auth.currentUser.uid;
  const q = query(collection(db, "users", uid, "docs"), orderBy("createdAt", "desc"), limit(50));
  const snap = await getDocs(q);
  const list = $("list");
  list.innerHTML = "";
  snap.forEach(d => {
    const data = d.data();
    const date = data.createdAt ? data.createdAt.toDate().toLocaleString("ar") : "";
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<div class="row"><div><strong></strong><small>${date}</small></div>
      <div><button class="sm open">فتح</button> <button class="del">حذف</button></div></div>`;
    div.querySelector("strong").textContent = data.name;
    div.querySelector(".open").onclick = () => openFile(d.id);
    div.querySelector(".del").onclick = async () => {
      if (!confirm("حذف هذا الملف؟")) return;
      await deleteDoc(doc(db, "users", uid, "docs", d.id));
      loadList();
    };
    list.appendChild(div);
  });
  if (snap.empty) list.innerHTML = '<p style="color:#6b7280">لا توجد ملفات بعد.</p>';
}

async function openFile(id) {
  status("جارٍ التحميل...");
  const snap = await getDoc(doc(db, "users", auth.currentUser.uid, "docs", id));
  const text = await unpack(snap.data().raw);
  $("fileName").value = snap.data().name;
  try { $("jsonText").value = JSON.stringify(JSON.parse(text), null, 2); }
  catch { $("jsonText").value = text; }
  status("تم التحميل.");
}

$("btnSave").onclick = async () => {
  const name = $("fileName").value.trim();
  const text = $("jsonText").value.trim();
  if (!name || !text) return status("اكتب اسماً ومحتوى.");
  try { JSON.parse(text); } catch { return status("JSON غير صالح."); }
  status("جارٍ الحفظ...");
  try {
    const raw = await pack(text);
    await addDoc(collection(db, "users", auth.currentUser.uid, "docs"), {
      name, raw, createdAt: serverTimestamp()
    });
    $("fileName").value = ""; $("jsonText").value = ""; $("filePick").value = "";
    status("تم الحفظ.");
    loadList();
  } catch (e) { status("خطأ: " + e.message); }
};
</script>
</body>
</html>
